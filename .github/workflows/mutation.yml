name: Mutation

# 2026-10-18 审计 P1：变异测试从 ci.yml 的手动 job 拆为独立工作流。
# - 月度 schedule + workflow_dispatch：全仓变异成本高，不进入每次 push 主路径；
# - 两个 curated 基线（CompressionProvider、Transactions/MySqlLeasePolicy）均 100%；
# - break=95：出现存活体即失败；JSON/HTML 报告上传 artifact 供趋势与复盘。
on:
  workflow_dispatch:
  schedule:
    # 每月 1 日 04:00 UTC（Asia/Shanghai 12:00；GitHub cron 用 UTC）
    - cron: '0 4 1 * *'

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '11.0.x'

      - name: Restore local tools
        run: dotnet tool restore

      - name: Mutation baseline (Compression)
        working-directory: test/PalDDD.Compression.Tests
        run: dotnet stryker --config-file stryker-config.json

      - name: Mutation baseline (Transactions lease policy)
        working-directory: test/PalDDD.Transactions.Tests
        run: dotnet stryker --config-file stryker-config.json

      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-reports
          path: test/**/StrykerOutput/**/reports/*
