name: Mutation

# 2026-10-18 审计 P1：变异测试从 ci.yml 的手动 job 拆为独立工作流。
# - 每周一 schedule + workflow_dispatch：全仓变异成本高，不进入每次 push 主路径；
# - 两个 curated 基线（CompressionProvider、Transactions/MySqlLeasePolicy）均 100%；
# - break=95：出现存活体即失败；JSON/HTML 报告上传 artifact 供趋势与复盘。
#
# 2026-11-07（v4 批 F）扩面与已知边界：
# - mutate 面在各自 project 内扩展（Transactions 增 RetryExecutor/OutboxWakeUpSignal，
#   Compression 增 SystemCompressor）——不改 `project` 字段，不跨程序集；
# - **零覆盖（必须明说）**：批 A/B/C 的 Messaging / CQRS / Transactions.EFCore 改动文件
#   不在这两份配置内，B5 的「基数/覆盖率」另一半未解决；那些改动的回归证据由各自的
#   锁定测试与变异反事实承载，**不由本工作流承载**；
# - CompileError 形态不计入有效信号（历史实测 422 个 CompileError 曾把基数压到个位数）；
# - 「break 真能红」的证据走 `scripts/mutation-probe.cs`（注入存活体 → 目标测试转红），
#   不依赖本工作流的 schedule；
# - 新增 Messaging/CQRS 测试工程的 stryker 配置 + 本文件 step 属**放弃范围**（新外部行为，
#   超出修复方案 v4 边界）。
#
# 2026-11-24（R16 裁决：mutation 基数问题收口）：
# - **mutation-replay 为唯一权威信号源**：`scripts/mutation-probe.cs` 从 TOOL 提升为
#   workflow 门禁 step，退出码 1 即 fail。该探针证明「拒绝过吗」这一轴：注入语义存活体后
#   目标测试必须转红（实测 2/2 探针转红，318 测试中 2 失败、49 测试中 41 失败），
#   不依赖被 filter 吃掉后的个位数 Stryker 基数。
# - **Stryker 降为趋势观察**：保留 schedule 与报告上传，但 continue-on-error: true。
#   thresholds.break=95 建立在 152 created→12 tested、2310 created→35 tested
#   （422 CompileError）的基数上，个位数上无区分度，不能作为通过/失败条件。
# - 「覆盖了多少」这一半仍未解决：本工作流只证明给定坏变异时测试能拒绝，
#   不计算 mutation score。扩大到 Messaging/CQRS/EFCore 时另立范围。
on:
  workflow_dispatch:
  schedule:
    # 每周一 04:00 UTC（Asia/Shanghai 周一 12:00；GitHub cron 用 UTC）
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '11.0.x'

      - name: Restore local tools
        run: dotnet tool restore

      # R16 裁决：权威门禁——注入语义存活体后目标测试必须转红。
      # 该探针不修改工作树（隔离副本上改写→跑测试→finally 还原），退出码 1 即 fail。
      - name: Mutation replay gate (authoritative)
        run: dotnet run scripts/mutation-probe.cs

      # 趋势观察：Stryker 分数建立在被 filter 吃掉后的个位数基数上，无区分度，
      # 不再作为通过条件；保留报告供历史趋势与扩面参考。
      - name: Mutation baseline (Compression)
        continue-on-error: true
        working-directory: test/PalDDD.Compression.Tests
        run: dotnet stryker --config-file stryker-config.json

      - name: Mutation baseline (Transactions lease policy)
        continue-on-error: true
        working-directory: test/PalDDD.Transactions.Tests
        run: dotnet stryker --config-file stryker-config.json

      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-reports
          path: test/**/StrykerOutput/**/reports/*
