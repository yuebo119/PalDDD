name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (must match Directory.Build.props)'
        required: true
      skip-nuget:
        description: 'Only create GitHub Release with nupkg attachments, do NOT push to NuGet.org (explicit opt-out, M3-9)'
        required: false
        type: boolean
        default: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # 2026-10-26 对齐 Pal.ORM M1-2：发布审批门——在 GitHub Settings → Environments →
    # production 配置 required reviewers 后，推送 NuGet 前需人工批准（发布即不可逆，
    # 审批点应在推送侧而非触发侧）。仓库侧未配置该 environment 时本声明无行为变化
    # （GitHub 隐式创建空环境直接放行），一次性配置见 docs/release.md §6.4。
    environment: production
    # ITM-717（2026-10-27 清零轮）：密钥收窄到唯一消费步。密钥本体只在 Push 步的 step env
    # 注入；三个判定步的 if 读 job 级布尔信号 HAS_NUGET_KEY（job env 允许 secrets 表达式，
    # step if 不允许直接读 secrets 上下文——2026-10-27 首发实证：if 内联 secrets 使整个
    # workflow 校验失败，v62 的 step env 不跨步坑以本布尔形态兼顾）。
    env:
      HAS_NUGET_KEY: ${{ secrets.NUGET_API_KEY != '' }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 2026-10-26 对齐 Pal.ORM：完整历史——SourceLink 嵌入 repository commit 需要
          # 可达历史，且 changelog-check C8 的「段日期 == tag 提交日」比对需要 tag 在
          # checkout 内可解析（浅克隆下 v<version> 引用不可达）。
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          # v64 P3-6: dispatch input via env indirection (script-injection hardening per GitHub guidance)
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="$DISPATCH_VERSION"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '11.0.x'

      - name: Verify version matches Directory.Build.props
        # 2026-10-26 对齐 Pal.ORM 两点：①比对改为 VersionPrefix+VersionSuffix 组合
        # 全版本——preview tag（如 v5.0.0-preview.1）不再被前缀比对误拒；②grep -oP
        # 改 POSIX sed——\K/lookahead 依赖 PCRE，非 GNU grep 环境（本地 Git Bash 复
        # 跑）不可用（Pal.ORM B87 教训）。
        run: |
          PREFIX=$(sed -n 's/.*<VersionPrefix>\([^<]*\)<\/VersionPrefix>.*/\1/p' Directory.Build.props | head -1)
          SUFFIX=$(sed -n 's/.*<VersionSuffix>\([^<]*\)<\/VersionSuffix>.*/\1/p' Directory.Build.props | head -1)
          if [ -z "$PREFIX" ]; then
            echo "ERROR: Directory.Build.props has no VersionPrefix"
            exit 1
          fi
          PROPS_VERSION="$PREFIX"
          if [ -n "$SUFFIX" ]; then PROPS_VERSION="$PREFIX-$SUFFIX"; fi
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [ "$PROPS_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: Version mismatch — Directory.Build.props=$PROPS_VERSION, tag/input=$TAG_VERSION"
            exit 1
          fi
          echo "Version match: $PROPS_VERSION"

      # 审计 2026-09-20 M2-3：tag 触发时校验对应 commit 的 CI 已通过。
      # 背景：tag 发布路径此前只跑本 workflow 的 build+test+AOT+pack，不跑
      # secret-scan/format-verify/coverage/encoding-gate/doc-consistency/tech-debt/
      # test-gate（这些只在 ci.yml 的 build-and-test 里）。本地 `git tag` + push 可打出
      # 从未经 CI 的 commit 的 tag，带缺陷的包会以"已发布"状态流出。
      # R11 F13：原实现只查 build-and-test 一个 job——coverage/aot-verify/semgrep/
      # quality-analyzers/dialect-probe/dapper-aot-probe 红或被跳过仍会发布。现按
      # ci.yml 的 job 全集逐个要求最近一次 completed 结论为 success。
      # 新增 CI job 时必须同步本清单（test-gate 的 T-DEF-4 仍守护超时项）。
      # workflow_dispatch 手动发布跳过该检查（显式人工意图，可能是重跑/补发）。
      - name: Verify CI passed for this commit (tag releases only)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Checking CI conclusions for $SHA ..."
          # 只取【已完成】里的最新一次（v3.1.0 首发实测的竞态）：tag 推送会再触发一次
          # 同 SHA 的 ci.yml，其 build-and-test 若仍在跑，conclusion 为 null；原 `head -1`
          # 取到它，就把「分支推送上已经全绿」误判为非 success，发布被无谓拒绝。
          RUNS=$(gh api "repos/${{ github.repository }}/commits/$SHA/check-runs")
          FAILED=""
          for JOB in build-and-test aot-verify dapper-aot-probe quality-analyzers semgrep coverage dialect-probe; do
            CONCLUSION=$(printf '%s' "$RUNS" | jq -r --arg name "$JOB" \
              '[.check_runs[] | select(.name == $name and .status == "completed")]
               | sort_by(.completed_at) | if length == 0 then "" else last.conclusion end')
            if [ "$CONCLUSION" != "success" ]; then
              FAILED="$FAILED $JOB(${CONCLUSION:-missing})"
            fi
          done
          if [ -n "$FAILED" ]; then
            echo "ERROR: CI not green for $SHA:$FAILED — 拒绝发布。"
            echo "请先确认该 commit 的 ci.yml 全部 job 通过（缺失表示尚未跑完或未触发）。"
            exit 1
          fi
          echo "CI passed for $SHA (all ci.yml jobs: success)"

      - name: Restore
        run: dotnet restore PalDDD.slnx

      - name: Build (warnings as errors)
        run: dotnet build PalDDD.slnx -c Release --no-restore -warnaserror

      - name: Unit + Integration tests
        run: |
          set -euo pipefail
          for proj in $(find test -name "*.Tests.csproj" ! -path "*/obj/*" ! -path "*/bin/*" | sort); do
            echo "== Testing: $proj =="
            dotnet test "$proj" --no-build -c Release --nologo
          done

      - name: AOT publish verification
        run: |
          set -euo pipefail
          dotnet publish samples/PalDDD.PalOrmSample/PalDDD.PalOrmSample.csproj \
            -c Release -r linux-x64 --self-contained \
            /p:PublishAot=true /p:PublishDir=bin/aot-publish \
            --nologo
          echo "AOT publish: PASSED"

      - name: Run AOT-published binary
        run: |
          set -euo pipefail
          ./samples/PalDDD.PalOrmSample/bin/aot-publish/PalDDD.PalOrmSample
          echo "AOT run: PASSED"

      - name: Verify CHANGELOG entry (before pack)
        # 2026-10-26 对齐 Pal.ORM M1-3：CHANGELOG 结构校验前置到 pack/push 之前——
        # 此前 release 路径无任何 CHANGELOG 校验（§4.1/§5.1 仅本地清单项），漏转正/
        # 日期失实可在推送 NuGet 之后才暴露。校验位次即阻断语义：放 push 之后形同虚设。
        # C1–C10 全集：[Unreleased] 首位 / tag 对账 / 分类顺序 / 预估措辞 / 术语泄漏 /
        # 顶部版本 == 本次发布版本 / 标题格式 / 段日期 == tag 提交日 / 日期单调 / 条目非空。
        run: |
          set -euo pipefail
          dotnet run scripts/changelog-check.cs -- "${{ steps.version.outputs.version }}"

      - name: Pack all publishable projects
        run: |
          set -euo pipefail
          mkdir -p release-packages
          # pack 阶段关闭 warnings-as-errors——.NET 11 preview 依赖（NU5104）、元包无 lib 目录（NU5128）
          # 等均为预期行为；构建阶段已用 -warnaserror 验证代码质量，pack 阶段不需重复
          for dir in src/*/; do
            proj=$(basename "$dir")
            csproj="src/$proj/$proj.csproj"
            if [ -f "$csproj" ]; then
              dotnet pack "$csproj" -c Release --no-build -o release-packages --nologo -p:TreatWarningsAsErrors=false
            fi
          done

      - name: Verify package count
        run: |
          COUNT=$(ls release-packages/*.nupkg | wc -l)
          # R11 F14 纠正：37 个 src 项目中 PalDDD.Prompts 显式 IsPackable=false，
          # 实际产出 36 个 nupkg（count-audit 的 packable 推导同为 36）。原值 35
          # 会让每次发布在此步必然失败。
          EXPECTED=36
          if [ "$COUNT" -ne "$EXPECTED" ]; then
            echo "ERROR: Package count mismatch — expected $EXPECTED, got $COUNT"
            ls release-packages/
            exit 1
          fi
          echo "Package count: $COUNT (expected $EXPECTED)"

      - name: Push to NuGet.org
        # R54-P1-1 勘正（2026-09-19 第五十四轮片1）：补 skip-nuget 接线——原条件只查
        # key 存在，「勾选 skip-nuget + 有 key」时 35 包照推（input 唯一有实际作用的
        # 场景完全失效，不可逆公开副作用）。ITM-717（2026-10-27）：密钥唯一注入点收窄到
        # 本步（step env），if 判定直接读 secrets 上下文。
        if: ${{ env.HAS_NUGET_KEY == 'true' && inputs.skip-nuget != true }}
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          PUSHED=0
          for nupkg in release-packages/*.nupkg; do
            echo "Pushing: $(basename $nupkg)"
            dotnet nuget push "$nupkg" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
            PUSHED=$((PUSHED+1))
          done
          # v60: push count assertion (mask-proof backstop for --skip-duplicate scenarios)
          echo "Pushed $PUSHED packages"
          EXPECTED=$(ls release-packages/*.nupkg | wc -l)
          if [ "$PUSHED" -ne "$EXPECTED" ]; then
            echo "ERROR: Push count mismatch - expected $EXPECTED, pushed $PUSHED"
            exit 1
          fi

      - name: NuGet push skipped (secret missing) — fail
        if: ${{ env.HAS_NUGET_KEY != 'true' && inputs.skip-nuget != true }}
        run: |
          # M3-9（v2 审计 O-4，2026-09-19）：原 v60 形态仅 ::warning:: 且 GitHub Release
          # 照建——「发布成功」可等于「0 个包发布」（假成功）。tag/手动触发均为显式
          # 发布意图，缺 key 应 fail 而非静默跳过。逃生门：手动触发时显式勾选
          # skip-nuget（只建 Release 附包、不推 NuGet 的模式成为显式选择）。
          echo "::error::NUGET_API_KEY is not configured - 35 packages were NOT pushed to NuGet.org. If you intentionally want a Release-only run (no NuGet push), re-run with the skip-nuget input set to true."
          exit 1

      - name: NuGet push intentionally skipped (explicit opt-out)
        if: ${{ env.HAS_NUGET_KEY != 'true' && inputs.skip-nuget == true }}
        run: |
          echo "::warning::NuGet push intentionally skipped (skip-nuget=true) - GitHub Release will be created with nupkg attachments only."

      - name: Extract Release Notes
        # 2026-10-26 对齐 Pal.ORM：Release body 此前是整个 CHANGELOG.md 全文，现改为
        # 当前版本段自动提取 + 动态包表（从实际 nupkg 产物生成，增减包零维护）+ 与上一
        # 版本的 compare 链接。发布说明唯一真源是 CHANGELOG.md，禁止手写第二份。
        # 版本段存在性已由上游 changelog-check C6 保证（段缺失在那一步即红）。
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"

          # ── 1. 提取 CHANGELOG 当前版本段（段界 = ## [ 行；本仓格式 ## [X.Y.Z] — 日期）──
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]")) { found=1; next }
            }
            found { print }
          ' CHANGELOG.md > release-notes.md

          # ── 2. 动态生成包表格（从实际打包产物读取，增减包零维护） ──
          PKG_TABLE=""
          for nupkg in release-packages/*.nupkg; do
            pkg=$(basename "$nupkg" | sed "s/\.$VERSION\.nupkg//")
            PKG_TABLE="$PKG_TABLE| $pkg | $VERSION |\n"
          done

          # ── 3. 获取上一版本号（CHANGELOG 中当前段的下一个 ## 行） ──
          PREV_VER=$(awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) { gsub(/## \[|\].*/, "", $0); print $0; exit }
              if (index($0, "[" ver "]")) found=1
            }
          ' CHANGELOG.md)

          # ── 4. 组装 Release Body ──
          {
            echo "# PalDDD $GITHUB_REF_NAME"
            echo ""
            if [ -n "$PREV_VER" ]; then
              echo "**[与 v$PREV_VER 对比](https://github.com/yuebo119/PalDDD/compare/v$PREV_VER...$GITHUB_REF_NAME)** |"
            fi
            echo "[NuGet](https://www.nuget.org/packages/PalDDD.Core) |"
            echo "[完整变更日志](https://github.com/yuebo119/PalDDD/blob/main/CHANGELOG.md)"
            echo ""
            echo "## 📦 发布包"
            echo ""
            echo "| 包名 | 版本 |"
            echo "|------|------|"
            echo -e "$PKG_TABLE" | head -n -1
            echo ""
            if [ -s release-notes.md ]; then
              echo "## 📋 变更明细"
              echo ""
              cat release-notes.md
              echo ""
            fi
            echo "---"
            echo ""
            echo "| 资源 | 链接 |"
            echo "|------|------|"
            echo "| 📖 文档 | [README](https://github.com/yuebo119/PalDDD#readme) |"
            echo "| 📋 全部变更 | [CHANGELOG.md](https://github.com/yuebo119/PalDDD/blob/main/CHANGELOG.md) |"
            echo "| 🏗️ 架构决策 | [ADR 目录](https://github.com/yuebo119/PalDDD/tree/main/docs/decisions) |"
            echo "| 🐛 报告问题 | [Issues](https://github.com/yuebo119/PalDDD/issues) |"
          } > full-release-body.md

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: PalDDD ${{ github.ref_name }}
          body_path: full-release-body.md
          files: release-packages/*.nupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
