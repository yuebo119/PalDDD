name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          include-prerelease: true

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore PalDDD.slnx

      - name: Build
        run: dotnet build PalDDD.slnx --no-restore -c Release

      - name: Test (unit + integration)
        # MTP 手写协议：dotnet test 一次只跑一个测试项目（多项目/--collect 批量触发
        # VSTest 握手 → exit 5，本地已实测复现）；PalDDD.Testing 为支持库非测试项目
        # 失败自诊断（unified v2.0，2026-08-20）：失败项目的 TUnit JSON 报告解析为
        # ::error 控制台注解——GitHub 将其转为 check-run 注解，公开 API 可读（无需认证下载日志）。
        run: |
          set -euo pipefail
          for csproj in $(find test -name '*.csproj' ! -name 'PalDDD.Testing.csproj' | sort); do
            echo "== Testing: $csproj =="
            if ! dotnet test "$csproj" --no-build -c Release --verbosity minimal 2>&1 | tee ci-last-test.log; then
              echo "::error ::FAILED PROJECT: $csproj"
              python3 scripts/ci-failed-tests.py "$(basename "$csproj" .csproj)" ci-last-test.log || true
              rm -f ci-last-test.log
              exit 1
            fi
          done
        env:
          # CI 环境：Testcontainers 自动启动 PG/MySQL/Kafka/RabbitMQ
          PALDDD_UPDATE_PUBLIC_API_SNAPSHOTS: '0'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/**'
          if-no-files-found: ignore

      - name: AI system self-check + gate
        run: |
          # .ai/ 是独立 git 仓库（.gitignore 第 95 行），fresh checkout 不存在——
          # 本地装有 .ai 才跑全量自检，否则退化为根目录快速门禁（G1-G3），
          # 避免 CI 在无 .ai 的仓库上必然失败（终验轮 B-1 实锤）
          if [ -d .ai/scripts ]; then
            bash .ai/scripts/verify-ai-system.sh
            bash .ai/scripts/gate-check.sh --allow-dirty
          else
            echo "SKIP .ai self-check: .ai 质量系统未随仓库分发"
            bash scripts/gate-check.sh
          fi

  aot-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          include-prerelease: true

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore samples/PalDDD.PalOrmSample/PalDDD.PalOrmSample.csproj

      - name: PublishAot verify
        run: dotnet publish samples/PalDDD.PalOrmSample/PalDDD.PalOrmSample.csproj -c Release -r linux-x64 /p:PublishAot=true --verbosity normal

  dialect-probe:
    # unified v2.0 Phase 2a：方言实测防线固化——40 断言 × PG/MySQL 从"本机可选跑"升 CI 必跑。
    # 定位是准发布门：路径触发（仅 Store/SQL/DDL/映射面变更），不阻塞 build-and-test 快速反馈。
    # 脚本用根 scripts/dialect-probe.sh（.ai 独立仓不随主仓分发的分发副本，真源 .ai/scripts/）。
    # 红测欠账：破坏一个 SQL 模板必红的一次性验证，待本 job 首次 CI 运行时补（tasks 2a.4）。
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PALDDD_TEST_PG: "Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=postgres"
      PALDDD_TEST_MYSQL: "Server=localhost;Port=3306;User ID=root;Password=root;Database=mysql"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Path gate（Store/SQL/DDL/映射面才跑；PR 全跑宁多验不漏验）
        id: paths
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "match=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! git rev-parse HEAD~1 >/dev/null 2>&1; then
            echo "match=1" >> "$GITHUB_OUTPUT"; exit 0   # 首提交/浅历史退化为全跑
          fi
          if git diff --name-only HEAD~1 HEAD | grep -qE '(PalDDD\.Dapper|docs/sql/|Store|SqlTemplates)'; then
            echo "match=1" >> "$GITHUB_OUTPUT"
          else
            echo "match=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup .NET
        if: steps.paths.outputs.match == '1'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          include-prerelease: true

      - name: Run dialect probe（每方言 20 断言，独立临时库自动清理）
        if: steps.paths.outputs.match == '1'
        run: bash scripts/dialect-probe.sh --allow-destructive-probe
