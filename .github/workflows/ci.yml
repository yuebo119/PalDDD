name: CI

on:
  push:
    branches: [main, dev]
    # 审计 2026-09-20 M2-3：tag 推送触发全量门禁。此前 tag 发布路径只跑 release.yml 的
    # build+test+AOT+pack，不跑 secret-scan/format-verify/coverage/encoding-gate/
    # doc-consistency/tech-debt/test-gate——发布验证强度低于日常 push。若 tag 从未经 CI
    # 的 commit 打出（本地 git tag + push 完全可能），带缺陷的包会以"已发布"状态流出。
    # 现 tag 触发与 push/PR 相同的完整门禁矩阵，release.yml 的 pack/push 因此建立在
    # 已验证的 commit 上。
    tags: ['v*']
  pull_request:
    branches: [main, dev]
  # 审计 2026-09-20 O2：补 workflow_dispatch——CI 失败后此前必须推空提交才能重跑
  workflow_dispatch:

# 审计 2026-09-20 O2：补 concurrency 组。此前连续推送会并行跑满 4 个 job，
# runner 配额与反馈延迟都被放大；同组新推送取消旧的在途运行（release.yml 已有同款配置，此处对齐）。
# ⚡ 实测耗时（2026-09-23 从 run 35505559608 的步骤级数据取，非估值）：
#   整轮墙钟 ≈ 10 分钟（4 job 并行 ⇒ 墙钟 = 最慢 job，不是总和）
#   build-and-test 584s：vuln-scan 39 + restore 4 + build 43 + format 34 + **test 438** + 门禁 7 + 开销 16
#   coverage       612s：**Coverage gate 单步 591** + 开销 21
#   aot-verify      63s · dialect-probe 6s（路径门控未触发时）/ ~146s（触发时）
#   ⇒ 唯一的墙钟瓶颈是"串行跑 16 个测试项目"，且被两个 job 各做一遍（裸跑 + 插桩）。
#     门禁脚本步骤仅 7s，不是瓶颈；本文件旧注释曾写"40 分钟 coverage + 20 分钟 aot-verify"，
#     系过期估值（实测 10m12s / 63s），已按实测勘正——避免据此误判 CI 成本。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

# 默认最小权限——各 job 未声明 permissions 时继承此块；upload-artifact 仅需 contents:read
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # fetch-depth: 0 —— gate-check G23/G24 以 `git diff HEAD~1..HEAD` 为变更集基线，
      # 浅克隆（默认 depth=1）下 HEAD~1 不可解析 → 两门在 CI 退化为 no-op（ITM-620）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: 依赖漏洞扫描（v54 真门禁——v53 版为 exit-0 no-op；JSON 解析有漏洞即 exit 1，替代 NU19xx 压制下人工审计）
        # MIG-011b：内嵌 python 判定迁 scripts/vuln-scan.cs（file-based app），逻辑等价
        run: |
          dotnet list package --vulnerable --include-transitive --format json > /tmp/vuln.json
          dotnet run scripts/vuln-scan.cs /tmp/vuln.json

      - name: Restore
        run: dotnet restore PalDDD.slnx

      - name: Build
        run: dotnet build PalDDD.slnx --no-restore -c Release

      - name: Format verify
        # 2026-09-19 增（盲区收口）：IDE0005 等格式违规此前只由手工全量自检脚本拦截
        # （gate-audit 矩阵中该脚本 = TOOL 手工调用），3c887c7 的未用 using 直达
        # 主干。--verify-no-changes 只校验不改写；须在 Build 之后（需先还原/编译）。
        run: dotnet format style PalDDD.slnx --verify-no-changes

      - name: Test (unit + integration)
        # MTP 手写协议：dotnet test 一次只跑一个测试项目（多项目/--collect 批量触发
        # VSTest 握手 → exit 5，本地已实测复现）；PalDDD.Testing 为支持库非测试项目
        # 失败自诊断（unified v2.0，2026-08-20）：失败项目的 TUnit JSON 报告解析为
        # ::error 控制台注解——GitHub 将其转为 check-run 注记，公开 API 可读（无需认证下载日志）。
        # 空转断言（v2 审计 M0-1 / T-1，2026-09-19）：glob 失效 / 全量 skip 时循环
        # 零次或部分执行 → 步骤必须红（「跑过东西的绿」才是绿）。ran==total 禁静默
        # 跳过（比硬下界 17 耐项目数漂移）；套件非空由「发现失败即 exit」的既有
        # 逻辑 + 每项目必有测试的仓规共同守护。
        run: |
          set -euo pipefail
          mapfile -t projects < <(find test -name '*.csproj' ! -name 'PalDDD.Testing.csproj' | sort)
          # ⚡ 并行化（2026-09-23）：本步骤实测 438s，占 build-and-test 的 75%，是唯一墙钟瓶颈。
          # 并行度 **保守起步 = 2**：仓库有墙钟敏感测试（如 OutboxProcessorTests 的
          # `WhenAny(stopTask, Delay(3s))` 超时护栏，见 T-21 注记「残余风险仅极慢 runner 上误报」），
          # 并行加剧 CPU 争用正好踩该点——故先小步，观察若干轮无 flaky 后再上调（改此常量即可）。
          # 三条既有安全属性全部保留：① MTP 一次一个项目（仍逐次 dotnet test 调用）；
          # ② 逐项目失败 → ::error 注解 + ci-failed-tests.cs 诊断；③ ran+failed==total 空转断言。
          # 变化：并发下**不再 fail-fast**（原实现首败即 exit，其余失败被掩盖）——改为跑完全部
          # 再汇总，逐项目报出，最后按 failed>0 退出非零。
          jobs=2
          rm -rf ci-test-results; mkdir -p ci-test-results
          for csproj in "${projects[@]}"; do
            base=$(basename "$csproj" .csproj)
            (
              set +e   # 子 shell 内关 errexit，否则 dotnet 失败会跳过退出码落盘
              dotnet test "$csproj" --no-build -c Release --verbosity minimal \
                > "ci-test-results/$base.log" 2>&1
              echo $? > "ci-test-results/$base.exit"
            ) &
            while [[ $(jobs -rp | wc -l) -ge $jobs ]]; do wait -n || true; done
          done
          wait || true
          ran=0; failed=0
          for csproj in "${projects[@]}"; do
            base=$(basename "$csproj" .csproj)
            code=$(cat "ci-test-results/$base.exit" 2>/dev/null || echo "missing")
            if [[ "$code" == "0" ]]; then
              ran=$((ran + 1))
            else
              failed=$((failed + 1))
              echo "::error ::FAILED PROJECT: $csproj (exit=$code)"
              tail -40 "ci-test-results/$base.log" 2>/dev/null || true
              dotnet run scripts/ci-failed-tests.cs "$base" "ci-test-results/$base.log" || true
            fi
          done
          if [[ ${#projects[@]} -eq 0 || $((ran + failed)) -ne ${#projects[@]} ]]; then
            echo "::error ::TEST STEP SPUN EMPTY: projects=${#projects[@]} ran=$ran failed=$failed — glob 失效或循环被跳过（v2 审计 T-1）"
            exit 1
          fi
          echo "✅ $ran / ${#projects[@]} test projects passed（failed=$failed，并行度=$jobs）"
          [[ $failed -eq 0 ]] || exit 1
        env:
          # CI 环境：Testcontainers 自动启动 PG/MySQL/Kafka/RabbitMQ
          PALDDD_UPDATE_PUBLIC_API_SNAPSHOTS: '0'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/**'
          if-no-files-found: ignore

      - name: AI system self-check + gate
        run: |
          # ITM-648：set -o pipefail 必须置于本步骤【首个管道调用之前】——GitHub 默认 bash -e
          # 无 pipefail，`if ! cmd | tee` 管道退出码取 tee 的 0，失败被掩码（SHELL-1 教训
          # 第五次现身：上轮把 set 放在 :120/:135 的六门禁循环前，漏了 :106 的 secret-scan
          # 首个调用点——CI 凭据门禁实为 no-op，探针 MASKED/CAUGHT 实锤）。提至块首覆盖全部管道。
          set -o pipefail
          # .ai/ 是独立 git 仓库（.gitignore:68 `/.ai`），fresh checkout 不存在。
          # 2026-09-22 裁决：`.ai` **保持独立 git 库**（不入库、不转 submodule）。
          # 据此删除原 `if [ -d .ai/scripts ]` 分支（T-02）——该分支在 CI 恒假，
          # 保留它会让本文件看起来跑了六门禁，而实际只跑降级门禁（静默 no-op 形态）。
          # CI 覆盖面（T-04 后，全部无条件执行）：
          #   secret-scan → dapper-param-guard → doc-consistency → config-policy →
          #   license-policy → count-audit → encoding-gate / tech-debt / test-gate 循环
          #   → gate-audit --inventory → gate-lite
          # 覆盖面边界（由 .ai 独立性决定，永不进 CI）：verify-ai / gate / template-gate
          #   依赖 .ai 内容，改由 .githooks/pre-commit 与 .ai 仓自身钩子承担（优化方案 T-35）。
          # 历史：F-04 勘正（2026-09-21）首次指出该分支恒假；ITM-615（2026-09-10）曾把
          # 四门禁追加进该分支，实为无效接线。gate-audit 矩阵的 WIRED 判定仍会把恒假分支
          # 内的调用计为接线（T-36 待修）。
          # unified v2.0（2026-08-20）：gate 步骤自诊断化（CI 实测 exit 2 本地却过——
          # tee 捕获 + CTX 注解通道让失败现场经公开 API 可读）
          # ITM-616：凭据扫描（主仓脚本，不依赖 .ai）——补 SE2 此前失实的防线。
          if ! dotnet run scripts/secret-scan.cs 2>&1 | tee ci-secret-scan.log; then
            echo "::error ::SECRET SCAN FAILED：受跟踪文件发现疑似硬编码凭据"
            dotnet run scripts/ci-failed-tests.cs secret-scan ci-secret-scan.log || true
            rm -f ci-secret-scan.log
            exit 1
          fi
          rm -f ci-secret-scan.log
          # dapper-param-guard（2026-09-14 增）：Dapper 参数枚举直传静态检查——
          # CI #94 根因（Dapper.AOT 拦截器直传驱动，PG 拒绝枚举）的前移防线；
          # 主仓脚本不依赖 .ai（纵深：防 --no-verify 绕过 pre-commit）。
          if ! dotnet run scripts/dapper-param-guard.cs 2>&1 | tee ci-dapper-param-guard.log; then
            echo "::error ::DAPPER PARAM GUARD FAILED：匿名 Dapper 参数含枚举直传（改 (int) 强转）"
            dotnet run scripts/ci-failed-tests.cs dapper-param-guard ci-dapper-param-guard.log || true
            rm -f ci-dapper-param-guard.log
            exit 1
          fi
          rm -f ci-dapper-param-guard.log
          # F-04：doc-consistency 是**主仓**脚本（scripts/doc-consistency.cs），不依赖 .ai——
          # 原实现在恒假的 .ai 分支内，CI 从未跑过。已提到分支外（2026-09-21）。
          if ! dotnet run scripts/doc-consistency.cs 2>&1 | tee ci-doc-consistency.log; then
            echo "::error ::DOC CONSISTENCY FAILED：文档口径与代码不一致"
            rm -f ci-doc-consistency.log
            exit 1
          fi
          rm -f ci-doc-consistency.log
          # config-policy（2026-09-25 增）：配置文件策略门禁——dependabot 双词表/结构
          # 必填项（groups vs ignore 两处 schema 词表不同，错值只在默认分支由
          # Dependabot 报出）+ 根 Directory.Build.* 的 Exec 构建期副作用（每处须
          # IgnoreExitCode 或 GITHUB_ACTIONS 跳过二者居一，防 -warnaserror 打断发布链）。
          if ! dotnet run scripts/config-policy.cs 2>&1 | tee ci-config-policy.log; then
            echo "::error ::CONFIG POLICY FAILED：dependabot 词表/结构或 Directory.Build Exec 违规"
            rm -f ci-config-policy.log
            exit 1
          fi
          rm -f ci-config-policy.log
          # license-policy（2026-09-25 增）：依赖许可策略门禁——2026-09-25 裁决
          # 「所有引用的库必须是开源的许可，不使用商业许可」的机械执行层（与
          # 2026-09-23 Verify.TUnit 停 32.x 同源）。deny-by-default 白名单 + 包级
          # 禁令 + 有期限的 gap 台账；nuspec 缺失/推不出 SPDX 即 fail-closed。
          # 放在 Restore/Build 之后：判定集取自 `dotnet list --include-transitive`
          # 且要读本机 NuGet 缓存的 nuspec，两者都以已还原为前提。
          if ! dotnet run scripts/license-policy.cs 2>&1 | tee ci-license-policy.log; then
            echo "::error ::LICENSE POLICY FAILED：非白名单许可 / 禁令命中 / gap 到期 / 无法判定"
            rm -f ci-license-policy.log
            exit 1
          fi
          rm -f ci-license-policy.log
          # count-audit（2026-09-25 增）：文档计数声明与源码推导一致——2026-09-25 文档
          # 清扫实证计数静默漂移（断言点 89→99、ADR 22→24、prompt 模板 9→10 等）只能
          # 靠 165 次人工工具调用才找全；推导真值门禁化，README/docs 里"写了但不真"
          # 的声明即在 CI 拦下。纯文件系统读取，与相邻门禁块同格式；纵深：pre-commit
          # 触发面仅 README*/docs 变更且可被 --no-verify 跳过，此处无条件补偿。
          if ! dotnet run scripts/count-audit.cs 2>&1 | tee ci-count-audit.log; then
            echo "::error ::COUNT AUDIT FAILED：文档计数声明与源码推导不一致"
            rm -f ci-count-audit.log
            exit 1
          fi
          rm -f ci-count-audit.log
          # T-04（2026-09-22）：三门禁从恒假分支提出，fresh checkout 必跑。前提已核验：
          # 三者对 .ai 的引用均带 Directory.Exists 守卫（encoding-gate.cs:256-260 的
          # EnumerateByNameSuffix、tech-debt.cs:330 的 ShFilesIn、osc-check.cs:281 自建目录），
          # 目录缺失即静默跳过，不产生假红。
          # 纵深意义：pre-commit 可被 --no-verify 跳过，此处是补偿扫描（审计 T5）。
          # MIG-002/003（2026-09-11）：assertion-strength-check.sh 已删除（判定下沉
          # test/.../AssertionStrengthGateTests.cs，随 Test 步骤运行）；doc-consistency-check.sh
          # 薄壳化（判定下沉 DocConsistencyGateTests）保留 D7——两者从循环中移除/保留如常。
          # flaky-gate.sh 需传 csproj（build + N 次 test，非快速门禁），不纳入。
          # pipefail 已在块首统一 set（ITM-648）——此处管道退出码不再被 tee 掩码。
          # MIG-012（2026-09-11）：门禁薄壳 bash→C# file-based app（dotnet run 直跑）。
          for repo_gate in encoding-gate tech-debt test-gate; do
            echo "== gate: $repo_gate =="
            if ! dotnet run "scripts/$repo_gate.cs" 2>&1 | tee "ci-$repo_gate.log"; then
              echo "::error ::GATE FAILED: $repo_gate"
              dotnet run scripts/ci-failed-tests.cs -- "$repo_gate" "ci-$repo_gate.log" || true
              rm -f "ci-$repo_gate.log"
              exit 1
            fi
            rm -f "ci-$repo_gate.log"
          done
          # T-04 扩展（2026-09-22）：gate.cs 实测**不依赖 .ai**（仅 2 处迁移注释；对照
          # verify-ai.cs 有 49 处 .ai 引用），历史上被误置于恒假分支。其 G23（公共 API 快照
          # ↔CHANGELOG 同步）与 G24（路径分隔符归一化）是主仓关切，应当进 CI。
          # --allow-dirty 保留原语义（CI workspace 有构建产物与 TestResults）。
          if ! dotnet run scripts/gate.cs -- --allow-dirty 2>&1 | tee ci-gate-cs.log; then
            echo "::error ::GATE FAILED: gate.cs（G22/G23/G24）"
            dotnet run scripts/ci-failed-tests.cs gate ci-gate-cs.log || true
            rm -f ci-gate-cs.log
            exit 1
          fi
          rm -f ci-gate-cs.log
          # T-03（2026-09-22）：门禁可信度矩阵自身的退化防线——REVIEW（未归类）桶非空即红。
          # 用 --inventory（快，跳过探针）；探针版留给 nightly。
          if ! dotnet run scripts/gate-audit.cs -- --inventory 2>&1 | tee ci-gate-audit.log; then
            echo "::error ::GATE AUDIT FAILED：门禁矩阵存在未归类脚本（REVIEW 桶非空）"
            rm -f ci-gate-audit.log
            exit 1
          fi
          rm -f ci-gate-audit.log
          # 根目录快速门禁（原仅在无 .ai 分支跑，现无条件跑）
          if ! dotnet run scripts/gate-lite.cs 2>&1 | tee ci-gate.log; then
            echo "::error ::ROOT GATE-CHECK FAILED"
            dotnet run scripts/ci-failed-tests.cs gate ci-gate.log || true
            exit 1
          fi
          rm -f ci-gate.log

  aot-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore samples/PalDDD.PalOrmSample/PalDDD.PalOrmSample.csproj

      - name: PublishAot verify
        run: dotnet publish samples/PalDDD.PalOrmSample/PalDDD.PalOrmSample.csproj -c Release -r linux-x64 /p:PublishAot=true --verbosity normal

      - name: Run AOT-published binary
        # SMP-101：publish 只验证编译期 0 警告，运行时路径（Outbox CRUD/事务提交回滚）
        # 需实跑确认——Program.cs 自带断言与 PASSED 输出，非零退出码即失败。
        # 产物为 linux-x64 自包含 native binary，直接执行即可（无需 dotnet 命令）。
        run: ./samples/PalDDD.PalOrmSample/bin/Release/net11.0/linux-x64/publish/PalDDD.PalOrmSample

      # 2026-09-13 补：PalOrmSample 的直接 ProjectReference 只有 PalORM.Sqlite，即本 job 此前
      # 只验证 PalORM 一条栈的 AOT 运行时安全。AotSample 引用 Core/Serialization/Transactions/
      # CQRS/DependencyInjection 五个主干项目，二者引用图不重叠——不补此步则主干 AOT 无 CI 守卫
      # （此前仅靠手动 publish，docs/release.md 自述其为「手动 AOT 验证示例」）。
      # 本地实证（2026-09-13，win-x64 等价形式）：publish 输出 "Generating native code"、
      # 产物仅 native exe（无托管 dll）、实跑 exit 0 且含 CQRS AOT 值类型管道检查通过。
      - name: Restore (AotSample)
        run: dotnet restore samples/PalDDD.AotSample/PalDDD.AotSample.csproj

      - name: PublishAot verify (AotSample)
        run: dotnet publish samples/PalDDD.AotSample/PalDDD.AotSample.csproj -c Release -r linux-x64 /p:PublishAot=true --verbosity normal

      - name: Run AOT-published binary (AotSample)
        run: ./samples/PalDDD.AotSample/bin/Release/net11.0/linux-x64/publish/PalDDD.AotSample

  coverage:
    # 2026-09-14 接线——此前 `scripts/ci-coverage.cs` 是「脚本就绪但未接线」的已知缺口。
    # 接线门槛是阈值校准：原 0.65 锚定 2026-07-30 基线 67.9%（67.9 − 3 ≈ 65），与当前
    # 实际脱节。本次实测 16/16 测试项目并集行覆盖率 **72.98%**（13146/18013，Debug 插桩；
    # 为下界——PalORM.Tests 仅本机因无 Docker 有 46 项未跑完，CI 上更高），按项目原始
    # 原则「基线 − 3pp 缓冲」校准阈值为 0.70（见 scripts/ci-coverage.cs ReadThreshold 注释）。
    # 独立 job 而非 build-and-test 内的一步：覆盖率需完整再跑一遍测试，放进主 job 会把
    # 关键路径拉长近一倍；独立 job 与 aot-verify / dialect-probe 同构——并行且失败域隔离。
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore tools（reportgenerator 由 .config/dotnet-tools.json 钉 5.5.11）
        # 覆盖率脚本用 `dotnet tool run reportgenerator` 合并 Cobertura；该工具此前 CI 从未还原
        run: dotnet tool restore

      - name: Coverage gate
        run: dotnet run scripts/ci-coverage.cs

  dialect-probe:
    # unified v2.0 Phase 2a：方言实测防线固化——断言 × PG/MySQL 从"本机可选跑"升 CI 必跑。
    # MIG-001（2026-09-11）：bash 探针脚本（双副本）转正为 DialectProbeTests——
    # test/PalDDD.Integration.Tests/DialectProbeTests.cs（12 测试/42 断言，探针 C# 本体直接
    # 复用 + 安全守卫逐条迁移：palddd_probe_* 库名白名单/ownership marker/连接串不打印）。
    # 容器由 Testcontainers 自管（服务容器块随之移除）；原 RunDialectGuarded 单方言降级
    # 语义由独立测试方法天然满足；AmbientTx 探针保留。
    # 定位不变：准发布门，路径触发（仅 Store/SQL/DDL/映射面变更），不阻塞快速反馈。
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # v60：全历史 diff——fetch-depth:2 在多 commit push 时漏检中间提交的 Dapper 变更

      - name: Path gate（Store/SQL/DDL/映射面才跑；PR 全跑宁多验不漏验）
        id: paths
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "match=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # v62 P2: push 事件用 before SHA 作 diff 基线——HEAD~1 只覆盖最后一个 commit，多 commit push 中间提交漏检（fetch-depth:0 与 diff 范围正交，v60 修复无效）
          BEFORE="${{ github.event.before }}"
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "match=1" >> "$GITHUB_OUTPUT"; exit 0   # PR/首推/force-push 退化为全跑
          fi
          # M3-10（v2 审计 O-5，2026-09-19）：原裸词 `Store` 匹配任何含 Store 的路径——
          # 目录改名（Store→Repository）时无声关闭探针。改锚定形态：Dapper 全前缀 +
          # PalORM Stores 目录 + SQL 文件 + SqlTemplates + EF 映射面（DbContext）。
          # 旧形态误触发的 InMemoryOutboxStore 等非 SQL 面变更不再触发（探针测 Dapper
          # 方言 SQL，与 InMemory 无关）；真触发面不小于旧形态
          if git diff --name-only "$BEFORE" HEAD | grep -qE '(src/PalDDD\.Dapper|src/PalDDD\.[^/]+/Stores?/|docs/sql/|\.sql$|SqlTemplates|DbContext)'; then
            echo "match=1" >> "$GITHUB_OUTPUT"
          else
            echo "match=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup .NET
        if: steps.paths.outputs.match == '1'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Run dialect probe tests（DialectProbeTests，Testcontainers PG/MySQL）
        if: steps.paths.outputs.match == '1'
        # MTP 手写协议：treenode-filter 在 -- 之后（dotnet test --filter 触发 VSTest 握手 exit 5）
        # 首跑失败自诊（MIG-001 收口追补）：tee + ci-failed-tests.cs 注解通道——GitHub 将
        # ::error 转 check-run 注解，公开 API 可读（无需 admin 日志权限即可定位失败测试名）。
        run: |
          set -o pipefail
          if ! dotnet test test/PalDDD.Integration.Tests/PalDDD.Integration.Tests.csproj -c Release -- --treenode-filter "/*/*/DialectProbeTests/*" 2>&1 | tee ci-dialect.log; then
            echo "::error ::DIALECT PROBE TESTS FAILED"
            dotnet run scripts/ci-failed-tests.cs PalDDD.Integration.Tests ci-dialect.log || true
            rm -f ci-dialect.log
            exit 1
          fi
          rm -f ci-dialect.log
