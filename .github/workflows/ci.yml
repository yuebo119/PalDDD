name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          include-prerelease: true

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore PalDDD.slnx

      - name: Build
        run: dotnet build PalDDD.slnx --no-restore -c Release

      - name: Test (unit + integration)
        run: dotnet test PalDDD.slnx --no-build -c Release --verbosity normal
        env:
          # CI 环境：Testcontainers 自动启动 PG/MySQL/Kafka/RabbitMQ
          PALDDD_UPDATE_PUBLIC_API_SNAPSHOTS: '0'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/**'
          if-no-files-found: ignore

      - name: AI system self-check + gate
        run: |
          bash .ai/scripts/verify-ai-system.sh
          bash .ai/scripts/gate-check.sh --allow-dirty

  aot-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          include-prerelease: true

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore samples/PalDDD.PalOrmSample/PalDDD.PalOrmSample.csproj

      - name: PublishAot verify
        run: dotnet publish samples/PalDDD.PalOrmSample/PalDDD.PalOrmSample.csproj -c Release -r linux-x64 /p:PublishAot=true --verbosity normal
