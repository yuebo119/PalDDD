name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # fetch-depth: 0 —— gate-check G23/G24 以 `git diff HEAD~1..HEAD` 为变更集基线，
      # 浅克隆（默认 depth=1）下 HEAD~1 不可解析 → 两门在 CI 退化为 no-op（ITM-620）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: 依赖漏洞扫描（v54 真门禁——v53 版为 exit-0 no-op；JSON 解析有漏洞即 exit 1，替代 NU19xx 压制下人工审计）
        run: |
          dotnet list package --vulnerable --include-transitive --format json > /tmp/vuln.json
          python3 - <<'EOF'
          import json, sys
          with open('/tmp/vuln.json') as f:
              data = json.load(f)
          found = []
          for project in data.get('projects', []):
              for fw in project.get('frameworks', []):
                  for pkg in fw.get('topLevelPackages', []) + fw.get('transitivePackages', []):
                      if pkg.get('vulnerabilities'):
                          found.append(f"{pkg['id']}@{pkg.get('resolvedVersion','?')} "
                                       + ", ".join(v.get('severity','?') for v in pkg['vulnerabilities']))
          if found:
              print(f"::error::{len(found)} 个包存在已知漏洞")
              for line in found:
                  print(f"  {line}")
              sys.exit(1)
          print("漏洞扫描通过：0 个已知漏洞")
          EOF

      - name: Restore
        run: dotnet restore PalDDD.slnx

      - name: Build
        run: dotnet build PalDDD.slnx --no-restore -c Release

      - name: Test (unit + integration)
        # MTP 手写协议：dotnet test 一次只跑一个测试项目（多项目/--collect 批量触发
        # VSTest 握手 → exit 5，本地已实测复现）；PalDDD.Testing 为支持库非测试项目
        # 失败自诊断（unified v2.0，2026-08-20）：失败项目的 TUnit JSON 报告解析为
        # ::error 控制台注解——GitHub 将其转为 check-run 注解，公开 API 可读（无需认证下载日志）。
        run: |
          set -euo pipefail
          for csproj in $(find test -name '*.csproj' ! -name 'PalDDD.Testing.csproj' | sort); do
            echo "== Testing: $csproj =="
            if ! dotnet test "$csproj" --no-build -c Release --verbosity minimal 2>&1 | tee ci-last-test.log; then
              echo "::error ::FAILED PROJECT: $csproj"
              python3 scripts/ci-failed-tests.py "$(basename "$csproj" .csproj)" ci-last-test.log || true
              rm -f ci-last-test.log
              exit 1
            fi
          done
        env:
          # CI 环境：Testcontainers 自动启动 PG/MySQL/Kafka/RabbitMQ
          PALDDD_UPDATE_PUBLIC_API_SNAPSHOTS: '0'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/**'
          if-no-files-found: ignore

      - name: AI system self-check + gate
        run: |
          # ITM-648：set -o pipefail 必须置于本步骤【首个管道调用之前】——GitHub 默认 bash -e
          # 无 pipefail，`if ! cmd | tee` 管道退出码取 tee 的 0，失败被掩码（SHELL-1 教训
          # 第五次现身：上轮把 set 放在 :120/:135 的六门禁循环前，漏了 :106 的 secret-scan
          # 首个调用点——CI 凭据门禁实为 no-op，探针 MASKED/CAUGHT 实锤）。提至块首覆盖全部管道。
          set -o pipefail
          # .ai/ 是独立 git 仓库（.gitignore 第 95 行），fresh checkout 不存在——
          # 本地装有 .ai 才跑全量自检，否则退化为根目录快速门禁（G1-G3），
          # 避免 CI 在无 .ai 的仓库上必然失败（终验轮 B-1 实锤）
          # CI 覆盖面（ITM-615 补全，2026-09-10）：
          #   有 .ai 时 = build + test + aot + gate-check + verify-ai-system（含 V23 镜像对内容比对）
          #     + encoding-gate + doc-consistency-check + tech-debt-scan + test-gate
          #     + template-gate + assertion-strength-check（后六项 2026-09-10 追加，均可离线运行、无外部依赖）；
          #   无 .ai 时 = build + test + aot + 根 G1-G3 快速门禁（降级）。
          # unified v2.0（2026-08-20）：gate 步骤自诊断化（CI 实测 exit 2 本地却过——
          # tee 捕获 + CTX 注解通道让失败现场经公开 API 可读）
          # ITM-616：凭据扫描（主仓脚本，不依赖 .ai）——两个分支都要跑，补 SE2 此前失实的防线。
          if ! bash scripts/secret-scan.sh 2>&1 | tee ci-secret-scan.log; then
            echo "::error ::SECRET SCAN FAILED：受跟踪文件发现疑似硬编码凭据"
            python3 scripts/ci-failed-tests.py secret-scan ci-secret-scan.log || true
            rm -f ci-secret-scan.log
            exit 1
          fi
          rm -f ci-secret-scan.log
          if [ -d .ai/scripts ]; then
            bash .ai/scripts/verify-ai-system.sh
            bash .ai/scripts/gate-check.sh --allow-dirty
            # ITM-615：六个离线快检门禁此前只在本地手跑，CI 无守护——追加到 .ai 分支。
            # MIG-002/003（2026-09-11）：assertion-strength-check.sh 已删除（判定下沉
            # test/.../AssertionStrengthGateTests.cs，随 Test 步骤运行）；doc-consistency-check.sh
            # 薄壳化（判定下沉 DocConsistencyGateTests）保留 D7——两者从循环中移除/保留如常。
            # flaky-gate.sh 需传 csproj（build + N 次 test，非快速门禁），不纳入。
            # pipefail 已在块首统一 set（ITM-648）——此处管道退出码不再被 tee 掩码。
            for ai_gate in encoding-gate doc-consistency-check tech-debt-scan test-gate template-gate; do
              echo "== .ai gate: $ai_gate =="
              if ! bash ".ai/scripts/$ai_gate.sh" 2>&1 | tee "ci-$ai_gate.log"; then
                echo "::error ::.ai GATE FAILED: $ai_gate"
                python3 scripts/ci-failed-tests.py "$ai_gate" "ci-$ai_gate.log" || true
                rm -f "ci-$ai_gate.log"
                exit 1
              fi
              rm -f "ci-$ai_gate.log"
            done
          else
            echo "SKIP .ai self-check: .ai 质量系统未随仓库分发"
            # pipefail 已在块首统一 set（ITM-648）。
            if ! bash scripts/gate-check.sh 2>&1 | tee ci-gate.log; then
              echo "::error ::ROOT GATE-CHECK FAILED"
              python3 scripts/ci-failed-tests.py gate ci-gate.log || true
              exit 1
            fi
          fi

  aot-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore samples/PalDDD.PalOrmSample/PalDDD.PalOrmSample.csproj

      - name: PublishAot verify
        run: dotnet publish samples/PalDDD.PalOrmSample/PalDDD.PalOrmSample.csproj -c Release -r linux-x64 /p:PublishAot=true --verbosity normal

      - name: Run AOT-published binary
        # SMP-101：publish 只验证编译期 0 警告，运行时路径（Outbox CRUD/事务提交回滚）
        # 需实跑确认——Program.cs 自带断言与 PASSED 输出，非零退出码即失败。
        # 产物为 linux-x64 自包含 native binary，直接执行即可（无需 dotnet 命令）。
        run: ./samples/PalDDD.PalOrmSample/bin/Release/net11.0/linux-x64/publish/PalDDD.PalOrmSample

  dialect-probe:
    # unified v2.0 Phase 2a：方言实测防线固化——断言 × PG/MySQL 从"本机可选跑"升 CI 必跑。
    # MIG-001（2026-09-11）：bash 探针脚本（双副本）转正为 DialectProbeTests——
    # test/PalDDD.Integration.Tests/DialectProbeTests.cs（12 测试/42 断言，探针 C# 本体直接
    # 复用 + 安全守卫逐条迁移：palddd_probe_* 库名白名单/ownership marker/连接串不打印）。
    # 容器由 Testcontainers 自管（服务容器块随之移除）；原 RunDialectGuarded 单方言降级
    # 语义由独立测试方法天然满足；AmbientTx 探针保留。
    # 定位不变：准发布门，路径触发（仅 Store/SQL/DDL/映射面变更），不阻塞快速反馈。
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # v60：全历史 diff——fetch-depth:2 在多 commit push 时漏检中间提交的 Dapper 变更

      - name: Path gate（Store/SQL/DDL/映射面才跑；PR 全跑宁多验不漏验）
        id: paths
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "match=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # v62 P2: push 事件用 before SHA 作 diff 基线——HEAD~1 只覆盖最后一个 commit，多 commit push 中间提交漏检（fetch-depth:0 与 diff 范围正交，v60 修复无效）
          BEFORE="${{ github.event.before }}"
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "match=1" >> "$GITHUB_OUTPUT"; exit 0   # PR/首推/force-push 退化为全跑
          fi
          if git diff --name-only "$BEFORE" HEAD | grep -qE '(PalDDD\.Dapper|docs/sql/|Store|SqlTemplates)'; then
            echo "match=1" >> "$GITHUB_OUTPUT"
          else
            echo "match=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup .NET
        if: steps.paths.outputs.match == '1'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Run dialect probe tests（DialectProbeTests，Testcontainers PG/MySQL）
        if: steps.paths.outputs.match == '1'
        # MTP 手写协议：treenode-filter 在 -- 之后（dotnet test --filter 触发 VSTest 握手 exit 5）
        run: dotnet test test/PalDDD.Integration.Tests/PalDDD.Integration.Tests.csproj -c Release -- --treenode-filter "/*/*/DialectProbeTests/*"
